<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <!-- CDN do Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-supabase-js@2"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Petz Lândia - Sistema de Gestão</title>
    <!-- Google Fonts & FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Cabeçalho -->
    <header>
        <div class="brand-container">
            <div class="brand-logo"><i class="fa-solid fa-heart"></i></div>
            <div class="brand-title">Petz <span>Lândia</span></div>
        </div>
        <div class="user-nav">
            <i class="fa-regular fa-bell"></i>
            <i class="fa-solid fa-circle-user fa-lg"></i>
        </div>
    </header>

    <!-- Navegação Principal -->
    <nav class="main-nav">
        <button class="nav-btn active" onclick="switchTab('atendimentos')"><i class="fa-solid fa-paw"></i> Atendimentos & Pets</button>
        <button class="nav-btn" onclick="switchTab('cadastros')"><i class="fa-solid fa-address-book"></i> Cadastros (Tutor/Pet)</button>
        <button class="nav-btn" onclick="switchTab('caixa')"><i class="fa-solid fa-cash-register"></i> Caixa Diário</button>
    </nav>

    <!-- Conteúdo Principal -->
    <div class="container">
        
        <!-- SEÇÃO 1: ATENDIMENTOS E PACOTES -->
        <section id="sec-atendimentos" class="tab-content active">
            <div class="grid-2col">
                <div class="panel">
                    <div class="panel-header">
                        <div class="panel-title"><i class="fa-solid fa-list-check"></i> Pets na Loja Hoje</div>
                        <button class="btn btn-yellow" onclick="openModal('modalAtendimento')"><i class="fa-solid fa-plus"></i> Novo Check-in</button>
                    </div>
                    <div class="filter-tabs">
                        <button class="filter-btn active" onclick="filterServices('todos', this)">Todos</button>
                        <button class="filter-btn" onclick="filterServices('avulso', this)">Avulsos</button>
                        <button class="filter-btn" onclick="filterServices('pacote', this)">Pacotes</button>
                    </div>
                    <div class="service-list" id="serviceList"></div>
                </div>

                <div class="panel">
                    <div class="panel-header">
                        <div class="panel-title"><i class="fa-solid fa-box-open"></i> Pacotes Ativos</div>
                        <button class="btn btn-purple btn-sm" onclick="openModal('modalPacote')"><i class="fa-solid fa-cart-shopping"></i> Vender Pacote</button>
                    </div>
                    <div id="packageList"></div>
                </div>
            </div>
        </section>

        <!-- SEÇÃO 2: CADASTROS (TUTOR E PET) -->
        <section id="sec-cadastros" class="tab-content">
            <div class="panel">
                <div class="panel-header">
                    <div class="panel-title"><i class="fa-solid fa-user-plus"></i> Novo Cadastro Integrado</div>
                </div>
                <form id="formCadastro" onsubmit="salvarCadastro(event)">
                    <div class="form-grid">
                        <div class="form-group">
                            <label>Nome do Tutor *</label>
                            <input type="text" id="cadTutorNome" class="form-control" required placeholder="Ex: João Silva">
                        </div>
                        <div class="form-group">
                            <label>WhatsApp / Telefone *</label>
                            <input type="text" id="cadTutorFone" class="form-control" required placeholder="(61) 98888-8888">
                        </div>
                        <div class="form-group">
                            <label>Nome do Pet *</label>
                            <input type="text" id="cadPetNome" class="form-control" required placeholder="Ex: Thor">
                        </div>
                        <div class="form-group">
                            <label>Raça e Porte *</label>
                            <input type="text" id="cadPetRaca" class="form-control" required placeholder="Ex: Poodle / Médio">
                        </div>
                        <div class="form-group full-width">
                            <label>Observações Fixas / Alergias</label>
                            <textarea id="cadPetObs" class="form-control" rows="2" placeholder="Ex: Alergico a xampu com perfume, agressivo com outros cães."></textarea>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-yellow" style="margin-top:15px;"><i class="fa-solid fa-save"></i> Cadastrar Tutor & Pet</button>
                </form>
            </div>
        </section>

        <!-- SEÇÃO 3: FLUXO DE CAIXA DIÁRIO -->
        <section id="sec-caixa" class="tab-content">
            <div class="panel">
                <div class="panel-header">
                    <div class="panel-title"><i class="fa-solid fa-chart-line"></i> Resumo Financeiro do Dia</div>
                </div>
                <div class="caixa-summary-cards">
                    <div class="card-metric">
                        <span>Total Faturado</span>
                        <h3 id="caixaTotal">R$ 0,00</h3>
                    </div>
                    <div class="card-metric">
                        <span>Entradas em PIX</span>
                        <h3 id="caixaPix">R$ 0,00</h3>
                    </div>
                    <div class="card-metric">
                        <span>Cartão / Dinheiro</span>
                        <h3 id="caixaOutros">R$ 0,00</h3>
                    </div>
                </div>
                <div class="panel-title" style="margin-top:20px;"><i class="fa-solid fa-receipt"></i> Histórico de Lançamentos de Hoje</div>
                <div class="service-list" id="caixaLancamentos" style="margin-top:10px;"></div>
            </div>
        </section>

    </div>

    <!-- MODAL: NOVO CHECK-IN -->
    <div class="modal-overlay" id="modalAtendimento">
        <div class="modal">
            <div class="modal-header">
                <h3>Novo Check-in de Pet</h3>
                <i class="fa-solid fa-xmark closeModalBtn" onclick="closeModal('modalAtendimento')"></i>
            </div>
            <div class="form-group">
                <label>Selecione o Pet / Tutor</label>
                <select class="form-control" id="selectPetCheckin"></select>
            </div>
            <div class="form-group">
                <label>Tipo de Cobrança</label>
                <select class="form-control" id="selectTipoCobranca">
                    <option value="pacote">Debitar do Pacote Ativo</option>
                    <option value="avulso">Atendimento Avulso</option>
                </select>
            </div>
            <div class="form-group">
                <label>Serviço Executado</label>
                <select class="form-control" id="selectServico">
                    <option value="Banho e Tosa">Banho e Tosa</option>
                    <option value="Somente Banho">Somente Banho</option>
                    <option value="Tosa Higiênica">Tosa Higiênica</option>
                </select>
            </div>
            <div class="form-group" id="groupValorAvulso">
                <label>Valor do Serviço (R$)</label>
                <input type="number" id="valorAvulso" class="form-control" value="70">
            </div>
            <div class="modal-actions">
                <button class="btn btn-sm btn-gray" onclick="closeModal('modalAtendimento')">Cancelar</button>
                <button class="btn btn-purple btn-sm" onclick="salvarCheckin()">Confirmar Entrada</button>
            </div>
        </div>
    </div>

    <!-- MODAL: VENDER PACOTE -->
    <div class="modal-overlay" id="modalPacote">
        <div class="modal">
            <div class="modal-header">
                <h3>Vender Novo Pacote de Banhos</h3>
                <i class="fa-solid fa-xmark closeModalBtn" onclick="closeModal('modalPacote')"></i>
            </div>
            <div class="form-group">
                <label>Selecione o Pet / Tutor</label>
                <select class="form-control" id="selectPetPacote"></select>
            </div>
            <div class="form-group">
                <label>Quantidade de Banhos / Serviços</label>
                <input type="number" id="qtdBanhosPacote" class="form-control" value="4">
            </div>
            <div class="form-group">
                <label>Valor Total do Pacote (R$)</label>
                <input type="number" id="valorPacote" class="form-control" value="240">
            </div>
            <div class="form-group">
                <label>Forma de Pagamento</label>
                <select class="form-control" id="pagamentoPacote">
                    <option value="PIX">PIX</option>
                    <option value="Cartão">Cartão de Crédito/Débito</option>
                    <option value="Dinheiro">Dinheiro</option>
                </select>
            </div>
            <div class="modal-actions">
                <button class="btn btn-sm btn-gray" onclick="closeModal('modalPacote')">Cancelar</button>
                <button class="btn btn-yellow btn-sm" onclick="salvarVendaPacote()">Confirmar Venda</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
